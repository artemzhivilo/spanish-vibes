[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "spanish-vibes"
version = "0.2.0"
description = "Chat-first Spanish learning app — texting a Spanish friend who happens to be a teacher."
readme = "README.md"
authors = [
    { name = "Artem Zhivilo" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "psycopg2-binary>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.1",
    "ruff>=0.3",
]
