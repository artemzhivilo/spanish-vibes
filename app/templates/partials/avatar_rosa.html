{# Abuela Rosa's stylized SVG avatar. Warm grandmother from Granada with glasses. #}
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- warm kitchen bg -->
  <rect width="64" height="64" fill="#F4E4D0"/>
  <rect x="0" y="42" width="64" height="22" fill="#D9B894" opacity="0.4"/>
  <line x1="0" y1="42" x2="64" y2="42" stroke="#C49A72" stroke-width="0.4" opacity="0.5"/>
  <!-- shoulders / cardigan -->
  <path d="M0 64 C 8 50, 22 46, 32 46 C 42 46, 56 50, 64 64 Z" fill="#A04E2C"/>
  <!-- apron tie hint -->
  <path d="M28 46 L 28 64 M 36 46 L 36 64" stroke="#D4A553" stroke-width="0.8" opacity="0.5"/>
  <!-- neck -->
  <rect x="28" y="40" width="8" height="8" fill="#EAD0B8"/>
  <!-- face — slightly rounder -->
  <ellipse cx="32" cy="28" rx="13" ry="14.5" fill="#EAD0B8"/>
  <!-- gray hair, soft -->
  <path d="M19 22 Q 18 13, 32 12 Q 46 13, 45 22 Q 45 27, 43 27 L 43 21 Q 32 17, 21 21 L 21 27 Q 19 27, 19 22 Z" fill="#C8C5BE"/>
  <!-- hair bun -->
  <ellipse cx="32" cy="13" rx="7" ry="4.5" fill="#C8C5BE"/>
  <ellipse cx="32" cy="13" rx="7" ry="4.5" fill="#000" opacity="0.05"/>
  <!-- round glasses -->
  <circle cx="27" cy="29" r="3.5" stroke="#3D2A1A" stroke-width="0.8" fill="none"/>
  <circle cx="37" cy="29" r="3.5" stroke="#3D2A1A" stroke-width="0.8" fill="none"/>
  <line x1="30.5" y1="29" x2="33.5" y2="29" stroke="#3D2A1A" stroke-width="0.7"/>
  <!-- eyes inside glasses -->
  <ellipse cx="27" cy="29" rx="1.1" ry="1.3" fill="#2A1810"/>
  <ellipse cx="37" cy="29" rx="1.1" ry="1.3" fill="#2A1810"/>
  <!-- warm cheeks -->
  <ellipse cx="24" cy="34" rx="2.5" ry="1.6" fill="#D4A553" opacity="0.35"/>
  <ellipse cx="40" cy="34" rx="2.5" ry="1.6" fill="#D4A553" opacity="0.35"/>
  <!-- warm smile + slight laugh lines -->
  <path d="M27.5 36 Q 32 39, 36.5 36" stroke="#6B3520" stroke-width="0.9" fill="none" stroke-linecap="round"/>
  <path d="M22 35 Q 23 36, 24 36.5" stroke="#A87A55" stroke-width="0.4" fill="none"/>
  <path d="M42 35 Q 41 36, 40 36.5" stroke="#A87A55" stroke-width="0.4" fill="none"/>
  <!-- small earrings -->
  <circle cx="19.5" cy="32" r="0.7" fill="#D4A553"/>
  <circle cx="44.5" cy="32" r="0.7" fill="#D4A553"/>
</svg>
