  <rect x="28" y="40" width="8" height="8" fill="#E8C9A8"/>

  <ellipse cx="32" cy="28" rx="13" ry="15" fill="#E8C9A8"/>

  <path d="M19 22 Q 18 12, 32 11 Q 46 12, 45 22 Q 45 26, 43 26 L 43 21 Q 32 16, 21 21 L 21 26 Q 19 26, 19 22 Z" fill="#3D2418"/>

  <ellipse cx="39" cy="33" rx="2.2" ry="1.4" fill="#C97B53" opacity="0.28"/>

  <path d="M28.5 35.5 Q 32 38, 35.5 35.5" stroke="#6B3520" stroke-width="0.9" fill="none" stroke-linecap="round"/>

  <circle cx="19.5" cy="32" r="0.7" fill="#C97B53"/>
  <circle cx="44.5" cy="32" r="0.7" fill="#C97B53"/>
