<div class="pl-question-wrap">
  <div class="qs-counter">{{ current }} / {{ total }}</div>
  <div class="mcq-question">{{ question.question }}</div>
  <div class="mcq-options">
    {% for option in question.options %}
    <button
      type="button"
      class="mcq-option"
      hx-post="/placement/answer"
      hx-target="#pl-body-{{ card_id }}"
      hx-swap="innerHTML"
      hx-vals='{"card_id": "{{ card_id }}", "selected": {{ loop.index0 }}}'
    >
      <span class="mcq-letter">{{ ['A', 'B', 'C', 'D'][loop.index0] }}</span>
      <span>{{ option }}</span>
    </button>
    {% endfor %}
  </div>
</div>
