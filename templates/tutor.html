{% extends "base.html" %}
{% block title %}Tutor · Spanish Vibes{% endblock %}

{% block content %}
<div class="flex flex-col h-screen bg-[#0a1520] overflow-hidden">

  <!-- Header -->
  <header class="shrink-0 flex items-center justify-between px-4 py-3
                 bg-[#0f1a1f] border-b border-slate-800">
    <div class="flex items-center gap-3">
      <a href="/" class="text-slate-500 hover:text-slate-300 transition text-sm">← Home</a>
      <span class="text-slate-700">|</span>
      <span class="text-sm font-bold text-violet-300 tracking-wide">AI Tutor</span>
    </div>
    <div class="flex items-center gap-3 text-xs text-slate-500">
      <form hx-post="/tutor/respond"
            hx-target="#tutor-chat"
            hx-swap="beforeend"
            hx-disabled-elt="find button"
            hx-on::after-request="scrollChat()"
            class="end-session-form">
        <input type="hidden" id="active-session-id" name="session_id" value="{{ session_id }}">
        <input type="hidden" name="activity_type" value="end_request">
        <input type="hidden" name="message" value="end session">
        <button type="submit" class="end-session-btn">End Session</button>
      </form>
      <span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span>
      Session active
      <button onclick="toggleDevPanel()" class="dev-toggle-btn" title="Toggle Prompt Inspector">
        { }
      </button>
    </div>
  </header>

  <!-- Chat area + Dev panel container -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Chat area -->
    <main id="tutor-chat"
          class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-4 scroll-smooth">

      <!-- Typing indicator (shown while planner is thinking) -->
      <div id="tutor-thinking" class="tutor-message hidden">
        <div class="tutor-avatar">🧑‍🏫</div>
        <div class="tutor-bubble">
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
          <span class="thinking-dot"></span>
        </div>
      </div>
    </main>

    <!-- Dev tools panel (toggle with button in header) -->
    <aside id="dev-panel" class="dev-panel hidden">
      <div class="dev-panel-header">
        <span class="dev-panel-title">Prompt Inspector</span>
        <button onclick="refreshDevPanel()" class="dev-panel-refresh" title="Refresh">↻</button>
      </div>
      <div id="dev-panel-content" class="dev-panel-content">
        <p class="text-slate-500 text-sm">Session starting...</p>
      </div>
    </aside>

  </div>

</div>

<!-- Tutor-specific styles -->
<style>
  /* ── Chat layout ── */
  .tutor-message {
    display: flex;
    align-items: flex-start;
    gap: 0.625rem;
    max-width: 80%;
  }
  .tutor-avatar {
    flex-shrink: 0;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    background: #1e3a47;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  .tutor-bubble {
    background: #1a2d35;
    border: 1px solid #2a4a5a;
    border-radius: 1rem;
    border-top-left-radius: 0.25rem;
    padding: 0.75rem 1rem;
    color: #cbd5e1;
    font-size: 0.9rem;
    line-height: 1.6;
    max-width: 100%;
  }
  .tutor-bubble-feedback {
    border-color: #4c1d95;
    background: #1a1040;
  }
  .tutor-text { margin: 0; }
  .tutor-plan-preview { color: #64748b; }

  .learner-message {
    display: flex;
    justify-content: flex-end;
  }
  .learner-bubble {
    background: #065f46;
    border-radius: 1rem;
    border-bottom-right-radius: 0.25rem;
    padding: 0.625rem 0.875rem;
    max-width: 75%;
  }
  .learner-text { color: #d1fae5; font-size: 0.9rem; margin: 0; }

  /* ── Activity cards ── */
  .tutor-activity-card {
    background: #111f28;
    border: 1px solid #2a3f4a;
    border-radius: 1rem;
    padding: 1.25rem;
    width: 100%;
    max-width: 520px;
  }
  .activity-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .persona-badge { color: #a78bfa; }
  .turn-counter  { color: #64748b; }
  .drill-badge   { color: #60a5fa; }
  .drill-progress { color: #64748b; }

  /* ── Learner input (plan response / free chat) ── */
  .learner-input-area { width: 100%; max-width: 520px; }
  .chat-input-form {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .chat-input {
    flex: 1;
    background: #0f1a1f;
    border: 1px solid #2a3f4a;
    border-radius: 0.75rem;
    padding: 0.625rem 0.875rem;
    color: #e2e8f0;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .chat-input:focus { border-color: #7c3aed; }
  .chat-send-btn {
    background: #7c3aed;
    color: white;
    border-radius: 0.75rem;
    padding: 0.625rem 1rem;
    font-weight: 700;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .chat-send-btn:hover { background: #6d28d9; }
  .end-session-btn {
    border: 1px solid #7f1d1d;
    color: #fecaca;
    background: #3f1115;
    border-radius: 0.6rem;
    padding: 0.34rem 0.62rem;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .end-session-btn:hover { background: #5f131a; }

  /* ── Conversation within chat ── */
  .conversation-messages {
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
    max-height: 320px;
    overflow-y: auto;
    margin-bottom: 0.875rem;
    padding-right: 0.25rem;
  }
  .conv-message { display: flex; flex-direction: column; gap: 0.2rem; }
  .conv-speaker { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
  .ai-message .conv-text {
    background: #1e3a47;
    border-radius: 0.875rem;
    border-top-left-radius: 0.2rem;
    padding: 0.625rem 0.875rem;
    color: #e2e8f0;
    font-size: 0.875rem;
    margin: 0;
    align-self: flex-start;
  }
  .user-message { align-items: flex-end; }
  .user-message .conv-text {
    background: #065f46;
    border-radius: 0.875rem;
    border-bottom-right-radius: 0.2rem;
    padding: 0.625rem 0.875rem;
    color: #d1fae5;
    font-size: 0.875rem;
    margin: 0;
    align-self: flex-end;
  }
  .correction-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    margin-top: 0.375rem;
  }
  .corr-chip {
    background: #451a03;
    border: 1px solid #92400e;
    border-radius: 999px;
    padding: 0.15rem 0.5rem;
    font-size: 0.7rem;
    color: #fbbf24;
    cursor: help;
  }
  .corr-chip del { opacity: 0.7; }
  .conv-input-form, .conv-done-form { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .conv-input {
    flex: 1;
    background: #0f1a1f;
    border: 1px solid #2a4a5a;
    border-radius: 0.75rem;
    padding: 0.625rem 0.875rem;
    color: #e2e8f0;
    font-size: 0.875rem;
    outline: none;
  }
  .conv-input:focus { border-color: #7c3aed; }
  .conv-send-btn, .conv-done-btn {
    background: #7c3aed;
    color: white;
    border-radius: 0.75rem;
    padding: 0.625rem 1rem;
    font-weight: 700;
    font-size: 0.875rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .conv-send-btn:hover, .conv-done-btn:hover { background: #6d28d9; }

  /* ── Conjugation drill ── */
  .drill-item { margin-bottom: 1rem; }
  .drill-prompt {
    font-size: 1.25rem;
    font-weight: 700;
    color: #e2e8f0;
    margin: 0.5rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .drill-person { color: #a78bfa; }
  .drill-slash  { color: #475569; }
  .drill-verb   { color: #60a5fa; }
  .drill-arrow  { color: #475569; }
  .drill-feedback {
    font-size: 0.8rem;
    padding: 0.375rem 0.625rem;
    border-radius: 0.5rem;
    margin-bottom: 0.5rem;
  }
  .feedback-correct { background: #052e16; color: #86efac; }
  .feedback-wrong   { background: #450a0a; color: #fca5a5; }
  .drill-input-form { display: flex; gap: 0.5rem; }
  .drill-input {
    flex: 1;
    background: #0f1a1f;
    border: 1px solid #2a4a5a;
    border-radius: 0.75rem;
    padding: 0.625rem 0.875rem;
    color: #e2e8f0;
    font-size: 1rem;
    outline: none;
  }
  .drill-input:focus { border-color: #3b82f6; }
  .drill-submit-btn {
    background: #2563eb;
    color: white;
    border-radius: 0.75rem;
    padding: 0.625rem 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .drill-submit-btn:hover { background: #1d4ed8; }
  .drill-submit-btn[disabled] {
    opacity: 0.5;
    cursor: wait;
  }
  .drill-complete {
    text-align: center;
    padding: 1rem 0;
  }
  .drill-score { font-size: 2.5rem; font-weight: 900; color: #a78bfa; margin: 0; }
  .drill-score-label { font-size: 0.875rem; color: #94a3b8; margin: 0.25rem 0 0.75rem; }
  .drill-errors { text-align: left; font-size: 0.75rem; color: #fca5a5; padding-left: 1.25rem; }
  .drill-continue-btn {
    background: #7c3aed;
    color: white;
    border-radius: 0.75rem;
    padding: 0.625rem 1.25rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 0.5rem;
  }
  .drill-done-form { display: flex; justify-content: center; margin-top: 0.75rem; }

  /* ── Session end card ── */
  .tutor-session-end-card {
    background: linear-gradient(180deg, #121f2a 0%, #101b24 100%);
    border: 1px solid #2f4a56;
    box-shadow: 0 10px 30px rgba(3, 15, 24, 0.35);
  }
  .tutor-session-end-head {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    margin-bottom: 0.75rem;
  }
  .tutor-session-end-icon { font-size: 1.45rem; }
  .tutor-session-end-title {
    font-size: 1rem;
    font-weight: 800;
    color: #c4b5fd;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .tutor-session-end-summary {
    color: #dbeafe;
    margin-bottom: 0.85rem;
    line-height: 1.55;
    font-size: 0.9rem;
  }
  .tutor-session-end-section { margin-top: 0.75rem; }
  .tutor-session-end-label {
    margin: 0 0 0.4rem;
    font-size: 0.73rem;
    letter-spacing: 0.04em;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 700;
  }
  .tutor-session-list {
    margin: 0;
    padding-left: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.32rem;
    font-size: 0.84rem;
  }
  .tutor-session-list-practice {
    list-style: none;
    padding-left: 0;
    gap: 0.6rem;
  }
  .tutor-session-practice-item {
    border: 1px solid #1f3642;
    background: #0f1a23;
    border-radius: 0.65rem;
    padding: 0.55rem 0.7rem;
  }
  .tutor-session-practice-main {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .tutor-session-practice-check { color: #86efac; }
  .tutor-session-practice-title { color: #e2e8f0; font-weight: 700; }
  .tutor-session-practice-score { color: #93c5fd; font-size: 0.78rem; font-weight: 700; }
  .tutor-session-practice-highlight {
    color: #94a3b8;
    margin: 0.3rem 0 0;
    font-size: 0.76rem;
  }
  .tutor-session-list-breakthroughs {
    color: #86efac;
    list-style: disc;
  }
  .tutor-session-list-working {
    color: #fbbf24;
    list-style: disc;
  }
  .tutor-session-next {
    margin: 0;
    color: #cbd5e1;
    font-size: 0.84rem;
    line-height: 1.45;
  }
  .tutor-session-end-fallback {
    margin: 0;
    color: #cbd5e1;
    font-size: 0.83rem;
  }
  .tutor-session-restart-form {
    margin-top: 1rem;
  }
  .tutor-session-restart-btn {
    width: 100%;
    background: linear-gradient(90deg, #7c3aed, #6d28d9);
    color: #fff;
    border-radius: 0.75rem;
    padding: 0.68rem 1rem;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .tutor-session-restart-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
  }
  .session-ended-disabled {
    opacity: 0.55;
    pointer-events: none;
  }

  /* ── Typing indicator ── */
  .thinking-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #64748b;
    animation: thinking 1.2s infinite ease-in-out;
  }
  .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes thinking {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  #tutor-thinking { gap: 0.375rem; }

  /* ── Feedback stats ── */
  .feedback-stats { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #2a3f4a; }
  .stat-rate { font-size: 1.5rem; font-weight: 900; color: #a78bfa; }
  .stat-concept { font-size: 0.75rem; color: #64748b; margin-left: 0.5rem; }
  .stat-highlight { font-size: 0.8rem; color: #86efac; margin-top: 0.25rem; }

  /* ── Drill progress bar ── */
  .drill-progress-bar {
    width: 100%;
    height: 4px;
    background: #1e3a47;
    border-radius: 999px;
    margin-bottom: 1rem;
    overflow: hidden;
  }
  .drill-progress-bar-fill {
    height: 100%;
    background: #10b981;
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  /* ── Drill feedback ── */
  .drill-feedback-correct { background: #052e16; color: #86efac; border: 1px solid #166534; }
  .drill-feedback-accent  { background: #451a03; color: #fbbf24; border: 1px solid #92400e; }
  .drill-feedback-wrong   { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }

  .drill-feedback-block {
    border-radius: 0.5rem;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.75rem;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .drill-feedback-time {
    margin-left: auto;
    font-size: 0.75rem;
    opacity: 0.7;
  }

  /* ── Completion card ── */
  .drill-missed { margin-top: 0.75rem; text-align: left; }
  .drill-missed-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; margin-bottom: 0.25rem; }
  .drill-err-person { color: #a78bfa; }
  .drill-err-verb   { color: #60a5fa; }
  .drill-err-user   { color: #fca5a5; }
  .drill-accent-slips { margin-top: 0.5rem; text-align: left; }

  /* ── Translation challenge ── */
  .transl-badge {
    background: #312e81; color: #a5b4fc;
    border-radius: 999px; padding: 0.2rem 0.6rem;
    font-size: 0.72rem; font-weight: 700;
  }
  .transl-item { margin-bottom: 0.75rem; }
  .transl-prompt {
    font-size: 1.1rem; font-weight: 600; color: #e2e8f0;
    margin-bottom: 0.5rem; line-height: 1.4;
  }
  .transl-hints { margin-bottom: 0.5rem; }
  .transl-hints-toggle { font-size: 0.75rem; color: #94a3b8; cursor: pointer; user-select: none; }
  .transl-hints-list { margin-top: 0.35rem; padding-left: 1rem; font-size: 0.78rem; color: #94a3b8; list-style: disc; }
  .transl-input-form { display: flex; flex-direction: column; gap: 0.5rem; }
  .transl-input {
    background: #0f1a1f; border: 1px solid #2a4a5a;
    border-radius: 0.75rem; padding: 0.625rem 0.875rem;
    color: #e2e8f0; font-size: 0.875rem;
    resize: vertical; outline: none; min-height: 56px;
  }
  .transl-input:focus { border-color: #7c3aed; }
  .transl-feedback-block {
    border-radius: 0.5rem; padding: 0.5rem 0.75rem;
    margin-bottom: 0.75rem; font-size: 0.8rem;
  }
  .transl-feedback-correct { background: #052e16; border: 1px solid #166534; }
  .transl-feedback-partial  { background: #1c1400; border: 1px solid #92400e; }
  .transl-feedback-wrong    { background: #1f0000; border: 1px solid #7f1d1d; }
  .transl-answered-en { font-size: 0.7rem; color: #94a3b8; margin-bottom: 0.2rem; font-style: italic; }
  .transl-answered-es { color: #e2e8f0; margin-bottom: 0.25rem; }
  .transl-fb-row { display: flex; align-items: flex-start; gap: 0.35rem; }
  .transl-fb-icon { font-size: 0.9rem; flex-shrink: 0; }
  .transl-fb-text { color: #cbd5e1; }
  .transl-complete { display: flex; flex-direction: column; }
  .transl-score { font-size: 2rem; font-weight: 800; color: #a5b4fc; text-align: center; margin: 0.75rem 0 0; }
  .transl-score-label { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem; }

  /* ── Circumlocution challenge ── */
  .circ-badge {
    background: #1e1b4b; color: #c4b5fd;
    border-radius: 999px; padding: 0.2rem 0.6rem;
    font-size: 0.72rem; font-weight: 700;
  }
  .circ-prompt-box {
    background: #1e293b; border: 1px solid #334155;
    border-left: 3px solid #7c3aed;
    border-radius: 0.5rem; padding: 0.875rem 1rem;
    margin-bottom: 0.75rem;
  }
  .circ-prompt-box-done { opacity: 0.75; }
  .circ-prompt-text { font-size: 1rem; color: #e2e8f0; line-height: 1.5; margin: 0; }
  .circ-instruction { font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.6rem; }
  .circ-form { display: flex; flex-direction: column; gap: 0.5rem; }
  .circ-input {
    background: #0f1a1f; border: 1px solid #2a4a5a;
    border-radius: 0.75rem; padding: 0.75rem 0.875rem;
    color: #e2e8f0; font-size: 0.875rem;
    resize: vertical; outline: none; min-height: 90px;
  }
  .circ-input:focus { border-color: #7c3aed; }
  /* Results card */
  .circ-response-box {
    background: #0f172a; border: 1px solid #1e293b;
    border-radius: 0.5rem; padding: 0.625rem 0.875rem;
    margin-bottom: 0.75rem;
  }
  .circ-response-text { color: #cbd5e1; font-size: 0.875rem; margin: 0.2rem 0 0; }
  .circ-section-label {
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: #64748b; margin: 0 0 0.3rem;
  }
  .circ-scores { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.75rem; }
  .circ-score-row { display: flex; align-items: center; gap: 0.5rem; }
  .circ-score-label { font-size: 0.72rem; color: #94a3b8; width: 7rem; flex-shrink: 0; }
  .circ-score-bar-bg {
    flex: 1; height: 6px; background: #1e293b;
    border-radius: 999px; overflow: hidden;
  }
  .circ-score-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .circ-bar-comm { background: #7c3aed; }
  .circ-bar-gram { background: #2563eb; }
  .circ-bar-res  { background: #059669; }
  .circ-score-pct { font-size: 0.72rem; color: #94a3b8; width: 2.5rem; text-align: right; flex-shrink: 0; }
  .circ-feedback { margin-bottom: 0.5rem; }
  .circ-feedback-text { color: #cbd5e1; font-size: 0.85rem; line-height: 1.5; }
  .circ-workarounds { background: #052e16; border: 1px solid #166534; border-radius: 0.5rem; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; }
  .circ-workaround-list { margin: 0.2rem 0 0; padding-left: 0; list-style: none; }
  .circ-workaround-item { font-size: 0.78rem; color: #86efac; padding: 0.15rem 0; }
  .circ-corrections { margin-bottom: 0.5rem; }

  /* ── Dev tools panel ── */
  .dev-toggle-btn {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 0.375rem;
    padding: 0.15rem 0.5rem;
    color: #94a3b8;
    font-family: monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .dev-toggle-btn:hover { background: #334155; color: #e2e8f0; }
  .dev-toggle-btn.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }

  .dev-panel {
    width: 480px;
    min-width: 380px;
    max-width: 50vw;
    background: #0c1118;
    border-left: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .dev-panel.hidden { display: none; }
  .dev-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #1e293b;
    background: #0f1520;
  }
  .dev-panel-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #7c3aed;
  }
  .dev-panel-refresh {
    background: none;
    border: 1px solid #334155;
    border-radius: 0.25rem;
    color: #94a3b8;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 0.1rem 0.4rem;
  }
  .dev-panel-refresh:hover { color: #e2e8f0; border-color: #7c3aed; }
  .dev-panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.375rem;
  }

  .dev-prompt-entry {
    border: 1px solid #1e293b;
    border-radius: 0.5rem;
    overflow: hidden;
  }
  .dev-prompt-entry[open] { border-color: #334155; }
  .dev-prompt-summary {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.6rem;
    cursor: pointer;
    font-size: 0.72rem;
    background: #111827;
    user-select: none;
  }
  .dev-prompt-summary:hover { background: #1e293b; }
  .dev-prompt-badge {
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .dev-prompt-model { color: #64748b; font-family: monospace; }
  .dev-prompt-time { color: #475569; margin-left: auto; font-family: monospace; }

  .dev-prompt-body { padding: 0.5rem 0.6rem; }
  .dev-prompt-section { margin-bottom: 0.5rem; }
  .dev-prompt-label {
    display: block;
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    margin-bottom: 0.2rem;
  }
  .dev-prompt-pre {
    background: #0a0e14;
    border: 1px solid #1e293b;
    border-radius: 0.375rem;
    padding: 0.5rem;
    font-size: 0.68rem;
    color: #94a3b8;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
    margin: 0;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    line-height: 1.5;
  }
  .dev-prompt-result { color: #86efac; }
</style>

<script>
  function scrollChat() {
    var chat = document.getElementById('tutor-chat');
    if (chat) chat.scrollTop = chat.scrollHeight;
  }
  function scrollConv() {
    var msgs = document.getElementById('conv-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }

  // Auto-start the session on page load
  document.addEventListener('DOMContentLoaded', function() {
    var sessionId = '{{ session_id }}';
    var userId    = '{{ user_id }}';

    // Show thinking indicator
    document.getElementById('tutor-thinking').classList.remove('hidden');

    fetch('/tutor/start', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'session_id=' + encodeURIComponent(sessionId)
           + '&user_id=' + encodeURIComponent(userId),
    })
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.getElementById('tutor-thinking').classList.add('hidden');
      var chat = document.getElementById('tutor-chat');
      var div = document.createElement('div');
      div.innerHTML = html;
      // Append each child node so HTMX event handling works
      while (div.firstChild) chat.appendChild(div.firstChild);
      htmx.process(chat);
      scrollChat();
      if (_devPanelVisible) refreshDevPanel();
    })
    .catch(function(e) {
      document.getElementById('tutor-thinking').classList.add('hidden');
      console.error('Failed to start tutor session', e);
    });
  });

  // ── Dev tools ──
  var _devPanelVisible = false;
  var _sessionId = '{{ session_id }}';

  function toggleDevPanel() {
    _devPanelVisible = !_devPanelVisible;
    var panel = document.getElementById('dev-panel');
    var btn = document.querySelector('.dev-toggle-btn');
    if (_devPanelVisible) {
      panel.classList.remove('hidden');
      btn.classList.add('active');
      refreshDevPanel();
    } else {
      panel.classList.add('hidden');
      btn.classList.remove('active');
    }
  }

  function refreshDevPanel() {
    fetch('/tutor/dev/prompts?session_id=' + encodeURIComponent(_sessionId))
      .then(function(r) { return r.text(); })
      .then(function(html) {
        document.getElementById('dev-panel-content').innerHTML = html;
        // Scroll to bottom
        var content = document.getElementById('dev-panel-content');
        content.scrollTop = content.scrollHeight;
      })
      .catch(function(e) {
        console.error('Dev panel refresh failed', e);
      });
  }

  // Auto-refresh dev panel after every HTMX response
  document.body.addEventListener('htmx:afterSettle', function() {
    if (_devPanelVisible) refreshDevPanel();
  });

  // Global HTMX error handler — show feedback when requests fail
  document.body.addEventListener('htmx:responseError', function(e) {
    console.error('HTMX request failed:', e.detail);
    document.getElementById('tutor-thinking').classList.add('hidden');
    var target = e.detail.target || document.getElementById('tutor-chat');
    var errDiv = document.createElement('div');
    errDiv.className = 'tutor-message';
    errDiv.innerHTML = '<div class="tutor-avatar">⚠️</div>'
      + '<div class="tutor-bubble" style="border-color:#7f1d1d">'
      + '<p class="tutor-text" style="color:#fca5a5">Something went wrong. Try again?</p>'
      + '</div>';
    target.appendChild(errDiv);
    scrollChat();
  });

  // Show thinking indicator while HTMX is fetching planner decisions
  document.body.addEventListener('htmx:beforeRequest', function(e) {
    var path = e.detail.pathInfo && e.detail.pathInfo.requestPath;
    if (path && (path.includes('/tutor/conversation/')
                 || path.includes('/tutor/drill/')
                 || path.includes('/tutor/translation/')
                 || path.includes('/tutor/circumlocution/')
                 || path.includes('/tutor/respond')
                 || path.includes('/tutor/new-session'))) {
      document.getElementById('tutor-thinking').classList.remove('hidden');
      scrollChat();
    }
  });
  document.body.addEventListener('htmx:afterSettle', function() {
    document.getElementById('tutor-thinking').classList.add('hidden');
    scrollChat();
    // Keep dev panel session ID in sync after new-session
    var activeId = document.getElementById('active-session-id');
    if (activeId) _sessionId = activeId.value;
  });
</script>
